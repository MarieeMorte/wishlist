<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мой вишлист</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
    <h1>Мой вишлист</h1>
    <div class="controls">
        <select id="group-by">
            <option value="price">Группировать: по цене</option>
            <option value="priority">Группировать: по приоритету</option>
            <option value="rating">Группировать: по рейтингу</option>
            <option value="created">Группировать: пора брать</option>
        </select>
        <select id="sort">
            <option value="price_asc">Сортировка: цена ↑</option>
            <option value="price_desc">Сортировка: цена ↓</option>
            <option value="rating_desc">Сортировка: рейтинг</option>
            <option value="priority">Сортировка: приоритет</option>
            <option value="created_desc">Сортировка: новые</option>
        </select>
    </div>
    <div id="summary" class="summary"></div>
</header>

<main>
    <form id="add-form">
        <div class="row">
            <input name="title" placeholder="Название" required>
            <select name="priority">
                <option value="medium">Средний приоритет</option>
                <option value="high">Высокий</option>
                <option value="low">Низкий</option>
            </select>
            <input name="target_price" type="number" step="0.01" placeholder="Целевая цена">
            <input name="note" placeholder="Заметка">
        </div>
        <div id="offers-inputs"></div>
        <div class="row">
            <button type="button" id="add-offer-row">+ Ещё ссылка</button>
            <button type="submit">Добавить товар</button>
        </div>
    </form>

    <div id="list"></div>
</main>

<script src="/app.js"></script>
</body>
</html>
